name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to the same branch/PR supersedes the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/MilkWala.Tests/MilkWala.Tests.csproj --configuration Release

  # MAUI only builds for the target platform's TFM; Android is the one a Linux runner can build.
  # This is what catches broken XAML, bindings and C# in the app itself.
  android-build:
    name: Build app (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build
        run: >
          dotnet build MilkWala.csproj
          --framework net10.0-android
          --configuration Release
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:InstallAndroidDependencies=true
          -p:AcceptAndroidSDKLicenses=True
